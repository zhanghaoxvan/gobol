[package]
name = "gobol"
version = "0.1.0"
edition = "2024"

[dependencies]
git2 = { version = "0.21", features = ["vendored-libgit2"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.4"
colored = "3.1"
cranelift-codegen = "0.134"
cranelift-frontend = "0.134"
cranelift-jit = "0.134"
cranelift-module = "0.134"
cranelift-object = "0.134"
target-lexicon = "0.13"

[[bin]]
name = "gobol"
path = "src/bin/gobol.rs"

[[bin]]
name = "grape"
path = "src/bin/grape.rs"
