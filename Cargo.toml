[package]
name = "gobol"
version = "0.2.0"
edition = "2024"

[dependencies]
git2 = { version = "0.21", features = ["vendored-libgit2"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.4"
colored = "3.1"
cranelift-codegen = "0.134"
cranelift-frontend = "0.134"
cranelift-module = "0.134"
cranelift-object = "0.134"
target-lexicon = "0.13"
tower-lsp = "0.20"
tokio = { version = "1", features = ["full"] }
dashmap = "6"
url = "2"
# Used at runtime (not build-time) by the `gobol::toolchain` module to
# discover the MSVC/MinGW C toolchain the same way rustc's own build
# scripts do — replacing hand-written vswhere/vcvarsall/which logic.
cc = "1.0"

[[bin]]
name = "gobol"
path = "src/bin/gobol.rs"

[[bin]]
name = "grape"
path = "src/bin/grape.rs"

[[bin]]
name = "gobol-lsp"
path = "src/bin/gobol-lsp.rs"
