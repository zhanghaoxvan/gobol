<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <rect width="500" height="500" fill="white"/>

  <!-- 左边 G 主体：上宽下窄 -->
  <path d="
    M 80,100
    L 280,100
    L 280,150
    L 120,150
    L 120,220
    L 250,220
    L 250,270
    L 120,270
    L 120,340
    L 260,340
    L 260,390
    L 80,390
    Z
  " fill="black"/>

  <!-- G 的缺口（右侧开口） -->
  <path d="
    M 280,150
    L 320,150
    L 320,220
    L 280,220
    Z
  " fill="white"/>

  <!-- 右上 L 竖线 -->
  <rect x="330" y="100" width="50" height="290" fill="black"/>

  <!-- L 底部的横线 -->
  <rect x="300" y="340" width="200" height="50" fill="black"/>

  <!-- L 底部右侧延伸 -->
  <rect x="450" y="340" width="30" height="50" fill="black"/>

  <!-- 内部 obol 字母组（两个 o 提上去） -->
  <!-- o -->
  <circle cx="160" cy="270" r="18" fill="white" stroke="black" stroke-width="8"/>
  <!-- b -->
  <rect x="185" y="230" width="22" height="40" fill="black"/>
  <circle cx="185" cy="250" r="15" fill="white" stroke="black" stroke-width="8"/>
  <!-- o -->
  <circle cx="230" cy="270" r="18" fill="white" stroke="black" stroke-width="8"/>
  <!-- l -->
  <rect x="260" y="230" width="20" height="50" fill="black"/>

  <!-- 底部 bbb 组（对应 ASCII 中的 bbb） -->
  <circle cx="155" cy="365" r="14" fill="white" stroke="black" stroke-width="7"/>
  <rect x="175" y="340" width="16" height="30" fill="black"/>

  <circle cx="205" cy="365" r="14" fill="white" stroke="black" stroke-width="7"/>
  <rect x="225" y="340" width="16" height="30" fill="black"/>

  <circle cx="255" cy="365" r="14" fill="white" stroke="black" stroke-width="7"/>
  <rect x="275" y="340" width="16" height="30" fill="black"/>
</svg>
