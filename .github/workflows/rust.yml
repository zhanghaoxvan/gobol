name: Rust

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --bins

      - name: Add binary to PATH (Unix)
        if: runner.os != 'Windows'
        run: echo "$PWD/target/release" >> "$GITHUB_PATH"

      - name: Add binary to PATH (Windows)
        if: runner.os == 'Windows'
        run: Add-Content -Path $env:GITHUB_PATH -Value "$env:GITHUB_WORKSPACE\target\release"
        shell: pwsh

      - name: Init test project (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p test-project
          cd test-project
          yes "" | grape init

      - name: Init test project (Windows)
        if: runner.os == 'Windows'
        run: |
          New-Item -ItemType Directory -Path test-project -Force
          Push-Location test-project
          "`n`n`n" | grape init
          Pop-Location
        shell: pwsh

      - name: Run test project
        run: |
          cd test-project
          grape run

      - name: Build test project
        run: |
          cd test-project
          grape build --release

      - name: Run Rust tests
        run: cargo test --verbose