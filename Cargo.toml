[workspace]
members = [
    "crates/gobol-common",
    "crates/gobol-frontend",
    "crates/gobol-ir",
    "crates/gobol-codegen",
    "crates/gobol-cli",
    "crates/gobol-lsp",
    "crates/grape",
]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"

[workspace.dependencies]
gobol-common = { path = "crates/gobol-common" }
gobol-frontend = { path = "crates/gobol-frontend" }
gobol-ir = { path = "crates/gobol-ir" }
gobol-codegen = { path = "crates/gobol-codegen" }
gobol-cli = { path = "crates/gobol-cli" }

serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
toml = "1.1.4"
colored = "3.1"
git2 = { version = "0.21", features = ["vendored-libgit2"] }
cranelift-codegen = "0.134"
cranelift-frontend = "0.134"
cranelift-module = "0.134"
cranelift-object = "0.134"
target-lexicon = "0.13"
tower-lsp = "0.20"
tokio = { version = "1", features = ["full"] }
dashmap = "6"
url = "2"
cc = "1.0"
